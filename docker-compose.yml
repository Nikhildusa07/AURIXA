services:
  postgres:
    image: postgres:16
    container_name: aurixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurixa
      POSTGRES_USER: aurixa
      POSTGRES_PASSWORD: aurixa
    ports:
      - "5432:5432"
    volumes:
      - aurixa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurixa -d aurixa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: aurixa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aurixa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurixa_postgres_data:
  aurixa_redis_data: